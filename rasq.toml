schema = "rasq.workspace/1"
sdk = "0.1.0"

[author]
namespace = "sample"

[[plugins]]
name = "media-fullscreen-plugin"
slot = "viewer.overlay"
id = "sample.media-fullscreen"

# 権限の理由(rasq build が配布物の目次 root.safety に入れ、Central が掲載に反映する)。
# 審査 (rasq-judge) は宣言した権限すべてに理由があるかを見る。無いと自動では承認されない。
[listing.safety]
external_hosts = []
data_handling = "データは端末の中だけで扱い、外部には送信しません。"

[[listing.safety.permissions]]
permission = "fow.widget"
reason = "見つけた QR コードの上に枠と操作ボタン(コピー / 開く / ミュート)を重ねるため"

[[listing.safety.permissions]]
permission = "mute.words"
reason = "QR コードの中身(URL)をミュートワードに追加する操作のため。追加の前にホストが確認を出す"
