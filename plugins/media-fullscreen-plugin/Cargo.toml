[package]
name = "media-fullscreen-plugin"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "全画面ビューワーの画像から QR コードを見つけて枠を重ね、タップでコピー / 開く / ミュート"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rasq-plugin-kit = { path = "../../kit" }
base64 = "0.22"
# PNG / JPEG のデコードだけ(wasm サイズを抑えるため default-features は切る)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11.0"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
