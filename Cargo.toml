[package]
name = "media-fullscreen-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rasq-plugin-kit = { path = "kit" }
rqrr = "0.11.0"
serde_json = "1"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }

[workspace]
members = ["kit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
